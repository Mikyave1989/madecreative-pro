# railway.toml — MadeCreative Worker Services

[build]
builder = "DOCKERFILE"
dockerfilePath = "workers/Dockerfile"

[[services]]
name = "agent-runner"
startCommand = "npx tsx workers/agent-runner.ts"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "scraper-cron"
startCommand = "npx tsx workers/scraper-cron.ts"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "outreach-worker"
startCommand = "npx tsx workers/outreach-worker.ts"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "report-worker"
startCommand = "npx tsx workers/report-worker.ts"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "monitoring-worker"
startCommand = "npx tsx workers/monitoring-worker.ts"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
