# railway.toml — MadeCreative Worker Services
#
# Deploys background workers to Railway EU (Frankfurt region).
# Each service runs independently. Docker build compiles TypeScript to dist/.
# Set env vars in Railway dashboard (shared environment group).

[build]
builder = "DOCKERFILE"
dockerfilePath = "workers/Dockerfile"

# ─── Agent Runner ─────────────────────────────────────────────────────────────
# Central dispatcher: polls AgentJob table and routes to the correct agent.
[[services]]
name = "agent-runner"
startCommand = "node workers/dist/agent-runner.js"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ─── Scraper Cron ─────────────────────────────────────────────────────────────
# Runs nightly at 02:00-05:00 CET. Reads ScrapeConfig and enqueues jobs.
[[services]]
name = "scraper-cron"
startCommand = "node workers/dist/scraper-cron.js"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ─── Outreach Worker ──────────────────────────────────────────────────────────
# Processes follow-up email sequences via BullMQ queue.
[[services]]
name = "outreach-worker"
startCommand = "node workers/dist/outreach-worker.js"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ─── Report Worker ────────────────────────────────────────────────────────────
# Generates monthly PDF reports and emails them to clients.
[[services]]
name = "report-worker"
startCommand = "node workers/dist/report-worker.js"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ─── Monitoring Worker ────────────────────────────────────────────────────────
# Watches platform health, sends alerts to admin on anomalies.
[[services]]
name = "monitoring-worker"
startCommand = "node workers/dist/monitoring-worker.js"

[services.deploy]
region = "europe-west1"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
