[phases.setup]
nixPkgs = ["nodejs_22", "git", "curl"]
cmds = ["corepack enable", "corepack prepare pnpm@9 --activate"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=4096 pnpm run build"]

[start]
cmd = "npx wrangler pages dev ./build/client --ip 0.0.0.0 --port 5173 --no-show-interactive-dev-session --compatibility-date 2024-11-01"

[variables]
NODE_ENV = "production"
PORT = "5173"
HUSKY = "0"
CI = "true"
