[phases.setup]
nixPkgs = ["nodejs_22", "git", "curl"]
cmds = ["corepack enable", "corepack prepare pnpm@9 --activate"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=4096 pnpm run build"]

[start]
cmd = "node server.mjs"

[variables]
NODE_ENV = "production"
PORT = "5173"
HUSKY = "0"
CI = "true"
